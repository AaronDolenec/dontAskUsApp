version: '3.8'

services:
  web:
    image: ghcr.io/aarondolenec/dontaskus-web:latest
    ports:
      - "8080:80"
    environment:
      # Runtime configuration: set these in your private docker-compose.yml or Portainer stack.
      API_BASE_URL: "http://api.example.com"
      FIREBASE_API_KEY: "your-firebase-api-key"
      FIREBASE_AUTH_DOMAIN: "your-project.firebaseapp.com"
      FIREBASE_PROJECT_ID: "your-firebase-project-id"
      FIREBASE_STORAGE_BUCKET: "your-project.firebasestorage.app"
      FIREBASE_MESSAGING_SENDER_ID: "123456789012"
      FIREBASE_APP_ID: "1:123456789012:web:abcdef1234567890"
      FIREBASE_MEASUREMENT_ID: ""
      FCM_PROJECT_ID: "your-firebase-project-id"
      FCM_SERVICE_ACCOUNT_JSON: "${FCM_SERVICE_ACCOUNT_JSON:-}"
      SECRET_KEY: "${SECRET_KEY:-replace_me}"
      # Add other runtime public config values here
      OTHER_PUBLIC_CONFIG: "value"

# If you have a backend container, add it here and share a Docker network
# db:
#   image: postgres:15
#   environment:
#     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
